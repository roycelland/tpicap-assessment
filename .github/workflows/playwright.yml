name: Playwright Tests
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node lts
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'

      - name: Install root dependencies
        run: npm ci 

      - name: Install App dependencies
        run: npm ci --prefix localdevserver/cinema-scheduler-master

      - name: Install Playwright dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Prepare report for deployment (resolve symlinks)
        if: always()
        run: |
          rm -rf playwright-report-deploy/
          cp -rL playwright-report/ playwright-report-deploy/

      - name: Upload Pages Artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: 'github-pages'
          path: 'playwright-report/'

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5
        if: always()
